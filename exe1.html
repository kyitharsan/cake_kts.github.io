<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Exercise 1</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    
  </head>
  <body>
    <h1 class="bg-warning-subtle text-warning text-end py-5">
        This is heading 1</h1>

        <h3 class="bg-danger-subtle text-center py-2 mt-3">Kyi Thar San</h3>

    <div class="container bg-secondary">This is Container</div>

    <div class="container-fluid bg-info">This is container fluid</div>

    <h3>Equal Two Columns</h3>
    <div class="row">
        <div class="col-lg-6 bg-danger">1</div>
        <div class="col-lg-6 bg-primary">2</div>
    </div>
    <h3>Equal Three Columns</h3>
    <div class="row">
        <div class="col-lg-4 bg-secondary">1</div>
        <div class="col-lg-4 bg-warning">2</div>
        <div class="col-lg-4 bg-info">3</div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
